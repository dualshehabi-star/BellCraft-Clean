name: Build Android APK (BellCraft)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source code ───────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node + pnpm ───────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          HOME: /root

      # ── 3. Build the React/Vite web bundle ───────────────────────────────
      - name: Build web app (Vite)
        working-directory: artifacts/bellcraft
        run: pnpm run build
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
          VITE_API_BASE_URL: https://bell-schedule-manager.replit.app

      # ── 4. Java + Android SDK ────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36 + build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ── 5. Capacitor sync ────────────────────────────────────────────────
      - name: Capacitor sync + fix settings.gradle
        working-directory: artifacts/bellcraft
        run: |
          pnpm exec cap sync android
          node scripts/fix-capacitor-settings.cjs
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 6. Signing keystore ───────────────────────────────────────────────
      # Two modes:
      #   A) KEYSTORE_BASE64 secret is set → decode and use the stored key.
      #      Required for Play Store publishing and consistent update signatures.
      #      Add these four secrets to your GitHub repository settings:
      #        KEYSTORE_BASE64  — base64-encoded .jks file  (see step output below)
      #        STORE_PASSWORD   — keystore password
      #        KEY_ALIAS        — key alias (e.g. "bellcraft")
      #        KEY_PASSWORD     — key password
      #
      #   B) No secrets → a fresh keystore is generated automatically.
      #      The build log prints the base64 of the generated keystore so
      #      you can save it as the KEYSTORE_BASE64 secret for future builds.
      - name: Set up signing keystore
        env:
          KEYSTORE_BASE64:       ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_SECRET:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET:   ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/artifacts/bellcraft/android/app/bellcraft.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"          >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET"           >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"     >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret found — generating a fresh keystore"
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -alias     bellcraft \
              -keyalg    RSA \
              -keysize   2048 \
              -validity  10000 \
              -dname     "CN=BellCraft,OU=Education,O=BellCraft,L=Riyadh,ST=Riyadh,C=SA" \
              -storepass bellcraft2024 \
              -keypass   bellcraft2024
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=bellcraft2024" >> $GITHUB_ENV
            echo "KEY_ALIAS=bellcraft"          >> $GITHUB_ENV
            echo "KEY_PASSWORD=bellcraft2024"   >> $GITHUB_ENV
            echo ""
            echo "════════════════════════════════════════════════════════"
            echo "  Copy the text below as the KEYSTORE_BASE64 secret"
            echo "  (Settings → Secrets → Actions → New repository secret)"
            echo "════════════════════════════════════════════════════════"
            base64 -w0 "$KEYSTORE_FILE"
            echo ""
          fi

      # ── 7. Gradle release build ───────────────────────────────────────────
      - name: Create local.properties
        working-directory: artifacts/bellcraft/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant Gradle execute permission
        working-directory: artifacts/bellcraft/android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: artifacts/bellcraft/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME:   ${{ env.ANDROID_HOME }}
          JAVA_HOME:      ${{ env.JAVA_HOME }}
          KEYSTORE_PATH:  ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ env.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ env.KEY_PASSWORD }}

      # ── 8. Upload APK ─────────────────────────────────────────────────────
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: bellcraft-release-apk
          path: artifacts/bellcraft/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
